config_version = "virustotal_config_v2"
enabled = false
api_key_environment_variable = "VIRUSTOTAL_API_KEY"
submit_high = true
submit_malicious = true
print_to_cli = true
print_submitted = true
print_skipped = false
write_normalized_results = true
poll_for_report = true
