name: Detection-First GitHub Actions Security

on:
  push:
    branches: [main, 'stage2742-candidate/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor GitHub Actions security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/
          advanced-security: true
          online-audits: true
          min-severity: low
          min-confidence: low

  actionlint:
    name: actionlint workflow correctness analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint 1.7.12
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
